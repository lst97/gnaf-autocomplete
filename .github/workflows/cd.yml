# ============================================================
# G-NAF Address Autocomplete — CD
# On push to main: build Docker image, push to GHCR, then
# deploy to the production server via Tailscale + SSH key.
#
# Required GitHub Secrets:
#   SSH_PRIVATE_KEY     - Base64-encoded SSH private key for the remote server
#                         Generate: base64 -i ~/.ssh/id_ed25519 | pbcopy
#   TAILSCALE_AUTH_KEY  - Tailscale pre-authenticated auth key (with tag:ci)
#                         Generate from admin console: Settings → Auth Keys
#   TAILSCALE_HOST       - Tailscale hostname or IP of the target machine
#   SSH_USER             - Linux user on the target machine
#   POSTGRES_PASSWORD    - Strong password for the DB (openssl rand -base64 32)
#   CORS_ORIGINS         - e.g. https://app.example.com
#   PUBLIC_URL           - e.g. https://api.example.com
#   TURNSTILE_SITE_KEY   - Cloudflare Turnstile site key
#   TURNSTILE_SECRET_KEY - Cloudflare Turnstile secret key
#   CF_TUNNEL_TOKEN      - (optional) Cloudflare Tunnel token
#
# Required GitHub Variables:
#   DEPLOY_DIR       - Remote path for the project (default: /opt/gnaf-autocomplete)
#   GNAF_DATA_DIR    - Remote path for G-NAF PSV files (default: /opt/gnaf-data/G-NAF MAY 2026/Standard)
#   GNAF_DATA_ROOT   - Remote root for G-NAF data volume mount (default: /opt/gnaf-data)
#   GNAF_VERSION     - G-NAF release label (default: MAY 2026)
#
# Prerequisites on the target machine:
#   1. tailscale up --ssh  (enables Tailscale SSH)
#   2. User $SSH_USER has docker compose access
# ============================================================
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - uses: actions/checkout@v6

      # --------------------------------------------------
      # 2. Set up Docker Buildx
      # --------------------------------------------------
      - uses: docker/setup-buildx-action@v4

      # --------------------------------------------------
      # 3. Log in to GitHub Container Registry
      # --------------------------------------------------
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 4. Image tags: sha-<short> + latest
      # --------------------------------------------------
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # --------------------------------------------------
      # 5. Build and push Docker image
      # --------------------------------------------------
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # 6. Connect runner to tailnet
      # --------------------------------------------------
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.TAILSCALE_HOST }}

      # --------------------------------------------------
      # 7. Set up SSH key and accept host key
      # --------------------------------------------------
      - name: Setup SSH
        run: |
          # Decode and install SSH private key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Start ssh-agent and load the key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

          # Accept the remote host key
          ssh-keyscan -H "${{ secrets.TAILSCALE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Persist ssh-agent for subsequent steps
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. Transfer config files to remote
      # --------------------------------------------------
      - name: Transfer files
        run: |
          set -e
          DEPLOY_DIR="${{ vars.DEPLOY_DIR || '/opt/gnaf-autocomplete' }}"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.TAILSCALE_HOST }}"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new"

          echo "→ Ensuring remote directory exists..."
          ssh ${SSH_OPTS} "${REMOTE}" "mkdir -p ${DEPLOY_DIR}"

          push_file() {
            local src="$1" dst="$2"
            for i in 1 2 3; do
              if ssh ${SSH_OPTS} "${REMOTE}" "cat > ${DEPLOY_DIR}/${dst}" < "${src}"; then
                echo "  ✓ ${dst}"
                return 0
              fi
              echo "  ⚠ Retry ${i} for ${dst}..."
              sleep 3
            done
            echo "✗ Failed to transfer ${src}"; exit 1
          }

          echo "→ Transferring docker-compose.yml..."
          push_file "docker-compose.yml" "docker-compose.yml"

          echo "→ Transferring postgresql.conf..."
          push_file "postgresql.conf" "postgresql.conf"

          echo "→ Transferring .env..."
          ssh ${SSH_OPTS} "${REMOTE}" "cat > ${DEPLOY_DIR}/.env" <<- ENVEOF
          PORT=8000
          NODE_ENV=production
          PUBLIC_URL=${{ secrets.PUBLIC_URL }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POOL_SIZE=20
          LOG_LEVEL=warn
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
          API_KEY_RATE_LIMIT=5000
          API_KEY_RATE_WINDOW_MS=3600000
          KEYGEN_RATE_LIMIT=10
          KEYGEN_RATE_WINDOW_MS=3600000
          MAX_KEYS_PER_DOMAIN=5
          SUGGEST_CACHE_MAX=1000
          SUGGEST_CACHE_TTL_MS=30000
          GNAF_DATA_DIR=${{ vars.GNAF_DATA_DIR || '/opt/gnaf-data/G-NAF MAY 2026/Standard' }}
          GNAF_DATA_ROOT=${{ vars.GNAF_DATA_ROOT || '/opt/gnaf-data' }}
          GNAF_VERSION=${{ vars.GNAF_VERSION || 'MAY 2026' }}
          CF_TUNNEL_TOKEN=${{ secrets.CF_TUNNEL_TOKEN }}
          ENVEOF

          echo "→ Writing deploy script..."
          ssh ${SSH_OPTS} "${REMOTE}" "cat > ${DEPLOY_DIR}/deploy.sh" <<- 'SSHEOF'
          #!/usr/bin/env bash
          set -eu
          DEPLOY_DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "${DEPLOY_DIR}"
          IMAGE="$1"
          SHA_TAG="$2"
          GNAF_DIR="$3"
          export IMAGE_TAG="${SHA_TAG}"
          echo "→ Pulling ${IMAGE}:${SHA_TAG}"
          docker compose pull api
          docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:latest" 2>/dev/null || true
          PSV_COUNT=$(ls "${GNAF_DIR}"/*_ADDRESS_DETAIL_psv.psv 2>/dev/null | wc -l || echo 0)
          if [ "${PSV_COUNT}" -lt 5 ]; then
            echo "→ Downloading G-NAF data..."
            docker compose run --rm -e GNAF_DATA_DIR="${GNAF_DIR}" \
              api bun run scripts/create-gnaf.ts \
              --dir "$(dirname "$(dirname "${GNAF_DIR}")")" 2>&1 || true
          fi
          MV_ROWS=$(docker compose exec -T db psql -U postgres -d gnaf \
            -tAc "SELECT COALESCE(reltuples::int, 0) FROM pg_class WHERE relname='address_search_mv'" 2>/dev/null || echo 0)
          MV_ROWS="${MV_ROWS:-0}"
          if [ "${MV_ROWS}" -lt 1000000 ]; then
            docker compose run --rm -e GNAF_DATA_DIR="${GNAF_DIR}" api bun run scripts/load.ts
          else
            echo "→ address_search_mv has ${MV_ROWS} rows — skipping load"
          fi
          docker compose up -d --remove-orphans
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "✓ API healthy (attempt $i)"; break
            fi
            [ "$i" -eq 12 ] && { echo "✗ Healthcheck failed"; exit 1; }
            sleep 5
          done
          docker image prune -af --filter "until=24h" 2>/dev/null || true
          echo "✓ Deployed ${IMAGE}:${SHA_TAG}"
          SSHEOF
          ssh ${SSH_OPTS} "${REMOTE}" "chmod +x ${DEPLOY_DIR}/deploy.sh"
          echo "✓ All files transferred"

      # --------------------------------------------------
      # 9. Run deploy script on remote
      # --------------------------------------------------
      - name: Deploy
        run: |
          DEPLOY_DIR="${{ vars.DEPLOY_DIR || '/opt/gnaf-autocomplete' }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SHA_TAG="${{ github.sha }}"
          GNAF_DIR="${{ vars.GNAF_DATA_DIR || '/opt/gnaf-data/G-NAF MAY 2026/Standard' }}"
          SSH_OPTS="-o StrictHostKeyChecking=accept-new"
          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.TAILSCALE_HOST }}"

          echo "→ Running deploy script..."
          for i in 1 2 3; do
            if ssh ${SSH_OPTS} "${REMOTE}" \
              "bash ${DEPLOY_DIR}/deploy.sh '${IMAGE}' '${SHA_TAG}' '${GNAF_DIR}'"; then
              echo "✓ Deploy succeeded (attempt ${i})"
              break
            fi
            echo "  ⚠ Deploy attempt ${i} failed, retrying..."
            sleep 5
          done || { echo "✗ Deploy failed after 3 attempts"; exit 1; }
