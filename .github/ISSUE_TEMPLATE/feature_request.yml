name: Feature Request
description: Suggest an idea for this project
title: "feat(scope): "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe the problem you're trying to solve
        and how this feature would help.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system would this affect?
      options:
        - API (new endpoint, middleware change)
        - Query Router (new tier, routing logic)
        - Database (new index, schema change)
        - Loader (faster import, new data source)
        - Corrector / Search (better fuzzy matching)
        - Test UI (frontend enhancement)
        - Deployment / Docker
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve? Be specific about the use case.
      placeholder: "When using the API with X workload, I find it difficult to ... because ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like. How should it work?
      placeholder: "A new endpoint at /suggest/batch that accepts multiple queries and returns ..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What workarounds or alternatives have you considered?
      placeholder: "I could send N parallel requests, but that increases latency because ..."

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How would this feature benefit you or the community?
      placeholder: "This would reduce query latency by X% for multi-address lookups."

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to confirm this is not a duplicate.
          required: true
        - label: I have described the problem clearly, not just the proposed solution.
          required: true
